id: io.github.ronan_d.sted
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: sted
modules:
  - name: sted
    buildsystem: simple
    build-commands:
      - cd zig-gobject && ../zig-compiler/zig build --fork=../zig-xml codegen -Dmodules=Gtk-4.0 -Dmodules=Adw-1 -Dgir-files-path=/usr/share/gir-1.0
      - cd sted && ../zig-compiler/zig build --prefix $FLATPAK_DEST
    sources:
      - type: archive
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        dest: zig-compiler
      - type: git
        url: https://github.com/ianprime0509/zig-xml.git
        branch: main
        dest: zig-xml
      - type: git
        url: https://github.com/ianprime0509/zig-gobject.git
        branch: main
        dest: zig-gobject
      - type: dir
        path: .
        dest: sted
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
